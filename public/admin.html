<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tableau de bord — Elite Football Academy</title>
<link rel="icon" href="assets/logo_elite.png" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --black:#0d100e; --black2:#161a17; --green:#14532d; --green2:#0f3d22; --green3:#1f7a45;
    --green-soft:#e7f0ea; --gold:#d4af37; --gold2:#b8902a; --gold-l:#e9cf6f;
    --cream:#f5f7f3; --cream2:#e9ede7; --ink:#161a17; --muted:#6c736e; --line:#e1e6df;
    --grad-green:linear-gradient(165deg,#16341f,#0c2014); --grad-gold:linear-gradient(135deg,#e9cf6f,#d4af37 50%,#b8902a);
    --shadow:0 18px 44px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  h1,h2,h3{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.4px}
  .btn{border:none;border-radius:50px;padding:.7rem 1.2rem;font-weight:700;cursor:pointer;font-family:'Barlow';font-size:.9rem}
  .btn-block{width:100%}
  .btn-primary{background:var(--grad-gold);color:#241c00;text-transform:uppercase;letter-spacing:.04em}
  /* ---- LOGIN ---- */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:2rem;background:var(--black)}
  .login-card{background:#fff;border-radius:18px;padding:2.4rem;width:min(380px,92%);text-align:center;border-top:5px solid var(--gold);box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .login-card img{width:84px;border-radius:50%;background:#fff;margin:0 auto 1rem;display:block}
  .login-card h2{color:var(--green);margin-bottom:1.2rem;text-transform:uppercase}
  .login-card input{width:100%;padding:.8rem 1rem;border:1px solid #d4d9d3;border-radius:10px;font-size:1rem;margin-bottom:1rem;font-family:inherit}
  .login-card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.2)}
  .err{color:#c0392b;font-size:.85rem;min-height:1.2em;margin-bottom:.5rem}
  /* ---- LAYOUT ---- */
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .sidebar{background:var(--grad-green);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sb-brand{display:flex;align-items:center;gap:.6rem;padding:1.1rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.12)}
  .sb-brand img{width:42px;height:42px;border-radius:50%;background:#fff;padding:2px;border:2px solid var(--gold)}
  .sb-brand b{font-family:'Anton';font-size:1rem;line-height:1.05;letter-spacing:.5px}
  .sb-brand b span{color:var(--gold)}
  .sb-nav{flex:1;padding:.7rem 0;overflow-y:auto}
  .sb-nav a{display:flex;align-items:center;gap:.7rem;padding:.8rem 1.2rem;color:#cfe0d5;font-size:.93rem;cursor:pointer;border-left:3px solid transparent}
  .sb-nav a:hover{background:rgba(255,255,255,.07)}
  .sb-nav a.active{background:rgba(212,175,55,.18);border-left-color:var(--gold);color:#fff;font-weight:600}
  .sb-nav .ic{width:22px;text-align:center}
  .sb-foot{padding:1rem 1.2rem;border-top:1px solid rgba(255,255,255,.12)}
  .sb-foot a{color:#cfe0d5;font-size:.82rem;display:block;margin-bottom:.5rem;text-decoration:none}
  .logout{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:50px;padding:.45rem .9rem;cursor:pointer;font-size:.82rem;width:100%}
  .main{padding:1.4rem 1.6rem 3rem;overflow-x:hidden}
  .topbar{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem}
  .topbar h1{font-size:1.5rem;color:var(--green);margin-right:auto;text-transform:uppercase}
  .menu-toggle{display:none;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:1.3rem;padding:.2rem .6rem;cursor:pointer}
  .reload{background:var(--grad-gold);border:none;color:#241c00;font-weight:700;border-radius:50px;padding:.5rem .9rem;cursor:pointer}
  /* ---- KPI ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.4rem}
  .kpi{background:#fff;border-radius:14px;padding:1.1rem 1.2rem;box-shadow:0 6px 16px rgba(0,0,0,.06);border-top:4px solid var(--gold)}
  .kpi .l{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .kpi .n{font-family:'Anton';font-size:1.7rem;color:var(--green);margin-top:.2rem;letter-spacing:.5px}
  .kpi.alt{border-top-color:var(--green)}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:1.2rem;margin-bottom:1.2rem}
  .panel{background:#fff;border-radius:16px;padding:1.2rem 1.3rem;box-shadow:0 6px 16px rgba(0,0,0,.06)}
  .panel h3{color:var(--green);font-size:1.05rem;margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
  .barlist{display:grid;gap:.6rem}
  .barrow{font-size:.85rem}
  .barrow .t{display:flex;justify-content:space-between;margin-bottom:.2rem}
  .bartrack{height:10px;background:var(--cream2);border-radius:6px;overflow:hidden}
  .barfill{height:100%;background:var(--grad-gold);border-radius:6px}
  .barfill.green{background:linear-gradient(90deg,#1f7a45,#14532d)}
  .alert{background:#fef0f0;border-left:4px solid #c0392b;padding:.6rem .8rem;border-radius:8px;font-size:.85rem;margin-bottom:.5rem}
  /* ---- TABLES ---- */
  .tablewrap{background:#fff;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.06);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:580px}
  th,td{padding:.7rem .8rem;text-align:left;border-bottom:1px solid var(--cream2);vertical-align:top}
  th{background:var(--green-soft);color:var(--green);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
  tr:hover td{background:#fbfdfa}
  .badge{font-size:.72rem;font-weight:700;padding:.22rem .6rem;border-radius:50px;color:#fff;display:inline-block}
  .b-nouveau{background:#e67e22}.b-contacté{background:#2980b9}.b-détection{background:#8e44ad}.b-inscrit{background:#27ae60}.b-refusé{background:#c0392b}
  .toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
  .toolbar input,.toolbar select{padding:.5rem .8rem;border-radius:50px;border:1px solid #d4d9d3;font-family:inherit}
  .btn-sm{padding:.4rem .8rem;border-radius:50px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;color:#fff}
  .btn-edit{background:#2980b9}.btn-del{background:#c0392b}.btn-add{background:var(--green)}.btn-gold{background:var(--gold2)}
  .chip{display:inline-block;padding:.2rem .6rem;border-radius:50px;font-size:.74rem;font-weight:600;background:var(--cream2);color:var(--ink)}
  .chip.on{background:#d4f5e0;color:#1e7a45}.chip.off{background:#f3d6d6;color:#a23}
  .pay-ok{color:#1e7a45;font-weight:700}.pay-late{color:#c0392b;font-weight:700}.pay-ex{color:#8e44ad;font-weight:700}
  select.statusSel{padding:.35rem .5rem;border-radius:8px;border:1px solid #d4d9d3;font-family:inherit}
  .mini{font-size:.78rem;padding:.35rem .7rem;border-radius:50px;color:#fff;text-decoration:none;display:inline-block}
  .mini.call{background:var(--green)}.mini.wa{background:#25D366}
  /* ---- FORMS ---- */
  .form-card{background:#fff;border-radius:14px;padding:1.3rem;box-shadow:0 6px 16px rgba(0,0,0,.06);margin-bottom:1.2rem}
  .form-card h3{color:var(--green);margin-bottom:.9rem}
  .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem}
  .frow label,.fblock label{display:block;font-size:.8rem;font-weight:500;margin-bottom:.7rem}
  input,select,textarea{font-family:inherit}
  .form-card input,.form-card select,.form-card textarea{width:100%;margin-top:.25rem;padding:.6rem .75rem;border:1px solid #d4d9d3;border-radius:8px;font-size:.9rem}
  .form-card input:focus,.form-card select:focus,.form-card textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.2)}
  .ok-msg{color:#1e7a45;font-size:.85rem;margin-top:.5rem;display:inline-block}
  .empty{text-align:center;color:var(--muted);padding:2.4rem}
  .hint{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
  canvas{max-width:100%}
  /* ---- planning ---- */
  .week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
  .day{background:#fff;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.06);overflow:hidden}
  .day h4{background:var(--green);color:#fff;font-family:'Anton';font-weight:400;font-size:.95rem;padding:.5rem .8rem;text-align:center;letter-spacing:.5px}
  .day .slots{padding:.5rem;display:grid;gap:.5rem;min-height:50px}
  .slot{background:var(--green-soft);border-left:3px solid var(--gold);border-radius:6px;padding:.45rem .55rem;font-size:.78rem;position:relative}
  .slot b{display:block;color:var(--green)}
  .slot .x{position:absolute;top:.3rem;right:.4rem;cursor:pointer;color:#c0392b;font-weight:700}
  .day .none{color:#b7beb6;font-size:.78rem;text-align:center;padding:.6rem}
  /* ---- modal ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:100;padding:1rem}
  .modal-bg.open{display:grid}
  .modal{background:#fff;border-radius:16px;padding:1.5rem;width:min(480px,96%);max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
  .modal h3{color:var(--green);margin-bottom:1rem}
  .modal label{display:block;font-size:.82rem;font-weight:500;margin-bottom:.7rem}
  .modal input,.modal select,.modal textarea{width:100%;margin-top:.25rem;padding:.6rem .75rem;border:1px solid #d4d9d3;border-radius:8px;font-family:inherit}
  .modal-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem}
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;width:236px;z-index:90;transform:translateX(-110%);transition:.3s}
    .sidebar.open{transform:translateX(0)}
    .menu-toggle{display:block}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <img src="assets/logo_elite.png" alt="Elite" />
      <h2>Tableau de bord</h2>
      <div class="err" id="loginErr"></div>
      <input type="password" id="pwd" placeholder="Mot de passe administrateur" required autocomplete="current-password" />
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appView" hidden>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand"><img src="assets/logo_elite.png" alt="" /><b><span>ELITE</span><br/>Football Academy</b></div>
      <nav class="sb-nav" id="nav">
        <a data-view="dashboard" class="active"><span class="ic">📊</span> Tableau de bord</a>
        <a data-view="inscriptions"><span class="ic">📝</span> Inscriptions</a>
        <a data-view="joueurs"><span class="ic">🧒</span> Joueurs</a>
        <a data-view="categories"><span class="ic">🗂️</span> Catégories</a>
        <a data-view="seances"><span class="ic">📅</span> Planning</a>
        <a data-view="detections"><span class="ic">🎯</span> Détections</a>
        <a data-view="finances"><span class="ic">💰</span> Finances</a>
        <a data-view="settings"><span class="ic">⚙️</span> Paramètres</a>
      </nav>
      <div class="sb-foot">
        <a href="/" target="_blank">🌐 Voir le site public</a>
        <button class="logout" id="logoutBtn">Déconnexion</button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h1 id="viewTitle">Tableau de bord</h1>
        <button class="reload" id="reloadBtn">↻ Actualiser</button>
      </div>
      <div id="content"><p class="empty">Chargement…</p></div>
    </main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script src="admin.js"></script>
</body>
</html>
