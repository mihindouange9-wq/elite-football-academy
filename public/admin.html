<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Elite Football Academy</title>
<link rel="icon" href="assets/logo_elite.png" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--black:#0d100e;--green:#14532d;--green3:#1f7a45;--gold:#d4af37;--cream:#f5f7f3;--ink:#161a17;--muted:#6c736e;--line:#e4e8e3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
  h1,h2,h3{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.5px}
  .container{width:100%;max-width:1100px;margin-inline:auto;padding-inline:18px}
  .btn{border:none;border-radius:50px;padding:.7rem 1.3rem;font-weight:700;cursor:pointer;font-family:'Barlow';text-transform:uppercase;font-size:.85rem}
  .btn-gold{background:linear-gradient(135deg,#e9cf6f,var(--gold) 50%,#b8902a);color:#241c00}
  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:2rem;background:var(--black)}
  .login-card{background:#fff;border-radius:18px;padding:2.4rem;width:min(380px,92%);text-align:center;border-top:5px solid var(--gold);box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .login-card img{width:84px;border-radius:50%;background:#fff;margin:0 auto 1rem}
  .login-card h2{color:var(--green);margin-bottom:1.2rem;text-transform:uppercase}
  .login-card input{width:100%;padding:.8rem 1rem;border:1px solid #d4d9d3;border-radius:10px;font-size:1rem;margin-bottom:1rem;font-family:inherit}
  .login-card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.2)}
  .err{color:#c0392b;font-size:.85rem;min-height:1.2em;margin-bottom:.5rem}
  /* topbar */
  .top{background:var(--black);color:#fff;padding:.9rem 0;border-bottom:3px solid var(--gold)}
  .top .container{display:flex;align-items:center;gap:.8rem}
  .top img{width:42px;height:42px;border-radius:50%;background:#fff;padding:2px}
  .top h1{font-size:1.05rem;margin-right:auto;color:#fff}
  .top h1 b{color:var(--gold)}
  .logout{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:50px;padding:.45rem .9rem;cursor:pointer;font-size:.82rem}
  .reload{background:var(--gold);border:none;color:#241c00;border-radius:50px;padding:.45rem .9rem;cursor:pointer;font-weight:700;font-size:.82rem}
  .wrap{padding:1.6rem 0 3rem}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.4rem}
  .stat{background:#fff;border-radius:14px;padding:1.1rem 1.2rem;box-shadow:0 6px 16px rgba(0,0,0,.06);border-top:4px solid var(--green)}
  .stat .n{font-family:'Anton';font-size:1.9rem;color:var(--green)}
  .stat:nth-child(2){border-top-color:var(--gold)} .stat:nth-child(2) .n{color:var(--gold2,#b8902a)}
  .stat .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
  .toolbar input,.toolbar select{padding:.55rem .9rem;border-radius:50px;border:1px solid #d4d9d3;font-family:inherit}
  .cards{display:grid;gap:1rem}
  .ins{background:#fff;border-radius:14px;padding:1.2rem 1.3rem;box-shadow:0 6px 16px rgba(0,0,0,.06);border-left:5px solid var(--green)}
  .ins.s-nouveau{border-left-color:#e67e22}.ins.s-contacté{border-left-color:#2980b9}.ins.s-détection{border-left-color:#8e44ad}
  .ins.s-inscrit{border-left-color:#27ae60}.ins.s-refusé{border-left-color:#c0392b;opacity:.75}
  .ins-head{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.5rem}
  .ins-name{font-family:'Anton';font-size:1.2rem;color:var(--green)}
  .badge{font-size:.72rem;font-weight:800;padding:.22rem .7rem;border-radius:50px;color:#fff;text-transform:uppercase}
  .b-nouveau{background:#e67e22}.b-contacté{background:#2980b9}.b-détection{background:#8e44ad}.b-inscrit{background:#27ae60}.b-refusé{background:#c0392b}
  .ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem .9rem;font-size:.9rem;margin:.5rem 0}
  .ins-grid b{color:var(--ink)}
  .ins-msg{font-size:.88rem;color:var(--muted);margin:.3rem 0;font-style:italic}
  .ins-act{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
  .ins-act select{padding:.4rem .6rem;border-radius:8px;border:1px solid #d4d9d3}
  .mini{font-size:.8rem;padding:.4rem .8rem;border-radius:50px;color:#fff;text-decoration:none}
  .mini.call{background:var(--green)}.mini.wa{background:#25D366}.mini.del{background:#c0392b;border:none;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:3rem}
  @media(max-width:680px){.stats{grid-template-columns:1fr 1fr}.ins-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginView">
  <div class="login">
    <form class="login-card" id="loginForm">
      <img src="assets/logo_elite.png" alt="Elite" />
      <h2>Espace admin</h2>
      <div class="err" id="loginErr"></div>
      <input type="password" id="pwd" placeholder="Mot de passe" required autocomplete="current-password" />
      <button type="submit" class="btn btn-gold" style="width:100%">Se connecter</button>
    </form>
  </div>
</div>

<div id="appView" hidden>
  <div class="top"><div class="container">
    <img src="assets/logo_elite.png" alt="" />
    <h1><b>ELITE</b> — Inscriptions</h1>
    <button class="reload" id="reloadBtn">↻ Actualiser</button>
    <button class="logout" id="logoutBtn">Déconnexion</button>
  </div></div>
  <div class="container wrap">
    <div class="stats">
      <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Demandes</div></div>
      <div class="stat"><div class="n" id="stNew">0</div><div class="l">Nouvelles</div></div>
      <div class="stat"><div class="n" id="stInscrits">0</div><div class="l">Inscrits</div></div>
      <div class="stat"><div class="n" id="stSE">0</div><div class="l">Sport-Études</div></div>
    </div>
    <div class="toolbar">
      <input id="search" placeholder="🔍 Rechercher (enfant, parent, tél)" />
      <select id="filter"><option value="">Tous les statuts</option><option>nouveau</option><option>contacté</option><option>détection</option><option>inscrit</option><option>refusé</option></select>
    </div>
    <div class="cards" id="cards"><p class="empty">Chargement…</p></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
